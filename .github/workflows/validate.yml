name: gate  # ruleset required check 名为 gate（同 CI-Workflows 自测做法）
on:
  pull_request:
    # edited（qodo review #1，CI-Workflows #8 同款加固）：adr-required/standards-diff
    # 消费可变的 PR title/body——不订阅 edited 则作者可在 check 通过后编辑掉
    # ADR 引用而不触发重验；补引用救活 fail 的 check 同样依赖 edited 重触发
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  gate:  # check 名 = job id；ruleset required check = gate
    runs-on: ubuntu-latest
    permissions:
      contents: read        # job 级最小权限（防后续新增 job 继承——CodeRabbit #5）
      pull-requests: read   # 仅 standards diff detection 步骤读取 PR 文件清单（ADR-0011 CI 语义细化）
    steps:
      # ── 自指门禁修复（ADR-0010 批次4）────────────────────────────
      # 防线（必需）：校验器与标准（profiles/词表/CT）从 base ref 取，
      # registry 数据从 PR head 取——同一 PR 内削弱 validate.py/profiles
      # 后"用被削弱的门禁审自己"的路径被关闭。
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.base_ref }}      # 标准侧 = base
          path: std
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: github.event_name == 'pull_request'
        with:                               # 数据侧 = PR merge ref（默认）
          path: data
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      # 标准/校验器变更检测（ADR-0011）：C1 型 PR（standards/decisions/scripts/CODEOWNERS/.github 变更）
      # 的规则与数据必须同源演进——base 旧规则审 head 新数据在词汇/结构演进上结构性不可行
      # （如词表新增）。此类 PR 的防线=CODEOWNERS owner-only 审查（C1）+ head 自洽双跑（下方）+
      # adr-required（ADR-0013：C1 变更必须引用 ADR）；base 侧防线保留给纯数据 PR（C2/C3）
      # ——ADR-0010 批次4 的防削弱场景不变。
      - name: standards diff detection
        id: stddiff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 文件清单三防线（qodo review #2 #3 + 追加：换行文件名绕过）：
          # 分页拉全量；rename 的 previous_filename 一并纳入 C1 判定（C1 资产改名
          # 移出受管路径同样是 C1 变更）；files API 3000 文件硬上限 fail-closed。
          # 计数与 C1 匹配全部在 jq 内按 JSON 对象处理——Git 允许文件名含换行，
          # 行流（grep -c / echo|grep）会被单文件多行虚增计数绕过截断检测
          # （qodo review：Newline filenames bypass truncation）。
          PR_API="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
          CHANGED=$(gh api "$PR_API" --jq '.changed_files')
          GOT=0
          C1_HIT=0
          PAGE=1
          while :; do
            PAGEJSON=$(gh api "$PR_API/files?per_page=100&page=$PAGE")
            if ! jq -e 'type == "array"' <<<"$PAGEJSON" >/dev/null 2>&1; then
              echo "::error::files API 第 $PAGE 页拉取失败——C1 判定完整性无法保证，fail-closed"
              exit 1
            fi
            N=$(jq 'length' <<<"$PAGEJSON")
            GOT=$((GOT+N))
            if jq -e '[.[] | .filename, (.previous_filename // empty)]
                     | any(test("^(standards/|decisions/|scripts/|\\.github/|CODEOWNERS|tests/)"))'                <<<"$PAGEJSON" >/dev/null 2>&1; then
              C1_HIT=1
            fi
            [[ $N -lt 100 ]] && break
            PAGE=$((PAGE+1))
          done
          if [ "$GOT" -lt "$CHANGED" ]; then
            echo "::error::PR 声明变更 $CHANGED 个文件但 files API 只返回 $GOT 个（3000 上限截断）——C1 判定完整性无法保证，fail-closed"
            exit 1
          fi
          echo "changed=$([[ $C1_HIT -eq 1 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # adr-required（ADR-0013 实装，checks.yaml 转 active——CT-CUR-003 闭环）：
      # C1 路径变更的 PR，title/body 必须引用 ADR-NNNN 且被引 ADR 须存在于
      # PR head 的 decisions/（防"引用已在 main 被拒/未合入的幽灵 ADR"）。
      - name: adr-required（C1 变更须引用 ADR）
        if: github.event_name == 'pull_request' && steps.stddiff.outputs.changed == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # 词边界（评审项）：防 NOTADR-0013junk 之类子串满足 ADR 要求绕过
          ADR_RE='\bADR-[0-9]{4}\b'
          if ! { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -qE "$ADR_RE"; then
            echo "::error::C1 路径变更（standards/decisions/scripts/.github/CODEOWNERS/tests）但 PR 未引用任何 ADR-NNNN（ADR-0013 adr-required）"
            exit 1
          fi
          MISSING=0
          for ref in $( { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -oE "$ADR_RE" | sort -u ); do
            num="${ref#ADR-}"
            if ! ls data/decisions/ADR-"${num}"-*.md >/dev/null 2>&1; then
              echo "::error::引用的 ${ref} 在 PR head 的 decisions/ 无对应文件"
              MISSING=1
            fi
          done
          exit $MISSING
      # 防线：base 的标准审 head 的数据（required——安全保证；仅纯数据 PR）
      - name: validate（标准=base，数据=head）
        if: github.event_name == 'pull_request' && steps.stddiff.outputs.changed != 'true'
        run: REGISTRY_DATA_ROOT="$GITHUB_WORKSPACE/data" python3 std/scripts/validate.py
      # 流程模拟器同防线（ADR-0011）：声明可执行性=CI 门禁，退出码非 0 拒绝
      - name: simulate（标准=base，数据=head）
        if: github.event_name == 'pull_request' && steps.stddiff.outputs.changed != 'true'
        run: REGISTRY_DATA_ROOT="$GITHUB_WORKSPACE/data" python3 std/scripts/simulate-wave.py
      # 可持续性：head 的标准审 head 的数据（required——C1 型 PR 的语义门禁；保证合并后 main 不红）
      - name: validate（标准=head 自洽，防合并后 main 红掉）
        if: github.event_name == 'pull_request'
        run: python3 data/scripts/validate.py
      - name: simulate（标准=head 自洽）
        if: github.event_name == 'pull_request'
        run: python3 data/scripts/simulate-wave.py
      # 元验证（ADR-0013，issue #9 P0-2）：validate.py 自身正确性的回归基线——
      # 正向（全树绿）+ 负向（注入缺陷必须被拒绝）。失败即 gate 失败，阻塞合并。
      - name: meta-validate（pytest，head 自洽）
        if: github.event_name == 'pull_request'
        working-directory: data
        run: python -m pytest tests/ -v
      - name: validate（main）
        if: github.event_name != 'pull_request'
        run: python3 scripts/validate.py
      - name: simulate（main）
        if: github.event_name != 'pull_request'
        run: python3 scripts/simulate-wave.py
      - name: meta-validate（pytest，main）
        if: github.event_name != 'pull_request'
        run: python -m pytest tests/ -v
