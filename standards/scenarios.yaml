version: 1
# ============================================================================
# Scenarios —— 流程测试场景注册表（ADR-0015：测试底层方法统一）
# ============================================================================
# 统一方法论：一切测试 = 给状态机喂事件序列 → 断言不变式（事件进/事件出/断言不变式）。
# 三层：
#   L1 断言原语（A1-A7，simulate-wave.py）——不变，全场景共用：
#     A1 actor 存在 / A2 权限合法 / A3 注意力有账 / A4 预算有归属 /
#     A5 事件有生产者 / A6 相位转移合法 / A7 留痕完整
#   L2 场景剧本（本文件）——声明化：id/class/narrative(事件序列走查)/asserts/hook
#   L3 门禁——PR 跑回归场景（class: regression）；CT 的声明层先决跑 control 场景
#     （class: control）；运行时攻击面由 adversary 按场景剧本执行
#
# 断言格式（L2 声明式，引擎求值；新场景优先纯声明式，复杂跨结构推导用 hook）：
#   asserts:
#     - {path: "standards/xxx.yaml#a.b.c", op: exists|eq|contains|contains_all|not_contains, value: ...}
#   hook: simulate-wave.py 中的场景函数名（S1-S12 存量；迁移至纯声明式 = 后续增量）
#
# 边界（诚实声明）：模拟测"声明的世界"（权限/相位/预算/事件逻辑自洽）；
#   实现的世界归 gate/verifier；防线真实有效归 escape_review/CT。
# ============================================================================
scenarios:

  # ── S1-S12 存量场景（ADR-0011 建立；断言主体在 simulate-wave.py hook）──────
  S1-happy-path:
    class: regression
    narrative: 意图→组队→planner 产卡→test_author 冻结测试树→card_gate→build→verify
      （verifier 判卷+review）→integrator 合并→release_bot behind flag→handoff→销毁
    hook: scenario_happy_path
    ct_refs: [CT-BLD-002, CT-PLN-001, CT-PLN-002, CT-TA-001, CT-RLB-001]
  S2-amendment-timeout:
    class: regression
    narrative: builder 发现卡歧义→amendment_request(normative)→owner 24h 未响应→
      默认动作=冻结+退回 backlog（绝不 approve）
    hook: scenario_amendment_timeout
    ct_refs: []
  S3-incident-unsafe-rollback:
    class: regression
    narrative: sev1 告警+rollback_safe=false+owner 睡觉→预授权矩阵仅放行安全动作；
      deploy_reverse 降级；TTL 到期升级
    hook: scenario_incident_unsafe_rollback
    ct_refs: [CT-RSP-001, CT-RSP-002, CT-DEP-001]
  S4-escalation-budget:
    class: regression
    narrative: builder↔test_author 僵持+overhead_pool 耗尽→升级通道不冻结（预算不变式）
    hook: scenario_escalation_budget
    ct_refs: []
  S5-judge-activation:
    class: regression
    narrative: 僵持首次发生（judge 未激活）→直达 owner；累计>=2→judge 实例化
      （approved+异族+无写路径）
    hook: scenario_judge_not_activated
    ct_refs: [CT-JDG-001]
  S6-incident-instantiation:
    class: regression
    narrative: sev3 走常规卡；sev1/sev2 incident_cell 实例化（座位绑定 approved）
    hook: scenario_incident_instantiation
    ct_refs: [CT-RSP-001]
  S7-backlog-loop:
    class: regression
    narrative: escape review 产 backlog 提案→curator 归并→下波次 producer_gate 强制处置
    hook: scenario_backlog_loop
    ct_refs: []
  S8-gaming-detection:
    class: regression
    narrative: builder PR 触及 tests/acceptance/**；holdout 失败 visible 全绿→
      gaming 信号→激活 holdout
    hook: scenario_gaming_detection
    ct_refs: [CT-BLD-001, CT-TA-003]
  S9-test-fix-path:
    class: regression
    narrative: builder 主张"测试写错了"→amendment_request(test_fix)→test_author 修正
      （非减弱型 auto；减弱型降级特权变更）
    hook: scenario_test_fix_path
    ct_refs: [CT-TA-003]
  S10-event-completeness:
    class: regression
    narrative: 遍历相位图+关键流事件→逐一断言有生产者（A7 留痕完整性）
    hook: scenario_event_completeness
    ct_refs: [CT-EVT-001]
  S11-trust-chain:
    class: regression
    narrative: io_contract schema 实存；机制服务有原型+词表内 allow；关键 schema
      语义抽查
    hook: scenario_trust_chain
    ct_refs: [CT-ADV-003]
  S12-cross-lifecycle:
    class: regression
    narrative: dev-wave 销毁后 stewardship 消费归档资产（数据层制品不随队销毁）
    hook: scenario_cross_lifecycle
    ct_refs: []

  # ── S13-S17 新场景（ADR-0015：纯声明式——零 hook，证明声明化可行）──────────
  S13-trivial-fastpath:
    class: regression
    narrative: owner 说"这文案错了"→interface_gateway 判 fix/trivial→自明验收（不经
      intent_ratification 示例批准）→scheduler 直分单 builder→verify（verifier 判卷
      不豁免）→integrator auto merge——全链零 owner 阻塞点
    asserts:
      - {path: "standards/intent-routing.yaml#intents.fix.acceptance_source", op: eq, value: self_evident}
      - {path: "standards/intent-routing.yaml#intents.fix.change_class", op: eq, value: trivial}
      - {path: "standards/intent-routing.yaml#intents.fix.owner_sync", op: contains, value: none}
      - {path: "standards/change-classes.yaml#classes.trivial.acceptance", op: contains, value: self_evident}
      - {path: "standards/change-classes.yaml#classes.trivial.review", op: contains, value: verifier}
      - {path: "standards/change-classes.yaml#classes.trivial.merge", op: contains, value: integrator auto}
      - {path: "standards/change-classes.yaml#classes.trivial.promote_if", op: exists}
    ct_refs: []
  S14-maintain-loop:
    class: regression
    narrative: 周扫开 issue→curator 周审转 backlog.proposals→归并→producer_gate 必处置
      →修复 PR 关 issue（复绿证据）→复绿——issue 不可能躺在列表里（消费/驳回/带条件
      延期三选一，无第四态）
    asserts:
      - {path: "standards/flows.yaml#maintain_loop.issue_lifecycle", op: exists}
      - {path: "standards/flows.yaml#maintain_loop.issue_lifecycle.closed", op: contains, value: 复绿}
      - {path: "standards/flows.yaml#maintain_loop.issue_lifecycle.deferred", op: contains, value: 机器可判定条件}
      - {path: "standards/flows.yaml#maintain_loop.invariants", op: contains, value: 无第四态}
      - {path: "standards/intent-routing.yaml#intents.maintain.acceptance_source", op: eq, value: pre_approved}
      - {path: "standards/team-collaboration.yaml#interfaces.backlog.producer_gate", op: exists}
      - {path: "standards/team-collaboration.yaml#interfaces.backlog.maintenance_trigger", op: exists}
    ct_refs: []
  S15-maintenance-wave:
    class: regression
    narrative: owner 长期无新意图，backlog 存 security 级条目或 aging>30d→curator 提请
      maintenance wave→delivery_squad 以 backlog 为波次范围组建→验收 pre_approved
    asserts:
      - {path: "standards/flows.yaml#maintain_loop.maintenance_wave.trigger", op: contains, value: security}
      - {path: "standards/flows.yaml#maintain_loop.maintenance_wave.trigger", op: contains, value: 30d}
      - {path: "standards/flows.yaml#maintain_loop.maintenance_wave.executor", op: contains, value: curator}
      - {path: "standards/flows.yaml#maintain_loop.maintenance_wave.acceptance", op: contains, value: pre_approved}
      - {path: "standards/team-collaboration.yaml#teams.delivery_squad.lifecycle.trigger", op: contains, value: maintenance_wave.trigger}
      - {path: "registry/teams/dev-wave.yaml#lifecycle.trigger", op: contains, value: maintenance_wave.trigger}
      - {path: "standards/team-collaboration.yaml#interfaces.backlog.entry_schema", op: exists}
    ct_refs: []
  S16-owner-control:
    class: regression
    narrative: owner 经 TUI 暂停执行态卡（停表停预算）→resume 回原相位；abort 不可逆
      reason 必填（need_gone/spec_wrong/superseded 三路善后）——控制动词=事件不是凭据
    asserts:
      - {path: "standards/flows.yaml#owner_control.verbs.pause.semantics", op: contains, value: wall_clock}
      - {path: "standards/flows.yaml#owner_control.verbs.abort.semantics", op: contains, value: reason 必填}
      - {path: "standards/flows.yaml#owner_control.verbs.abort.reason_routing.spec_wrong", op: contains, value: backlog}
      - {path: "standards/team-collaboration.yaml#artifacts.card.lifecycle.states", op: contains_all, value: [paused, aborted]}
      - {path: "standards/team-collaboration.yaml#flow.event_producers.card.paused", op: exists}
      - {path: "standards/team-collaboration.yaml#flow.event_producers.card.aborted", op: exists}
      - {path: "standards/observability.yaml#control_surface.verbs", op: contains_all, value: [pause, resume, abort]}
      - {path: "standards/flows.yaml#owner_control.verbs", op: contains_all, value: [pause, resume, abort]}
      - {path: "standards/flows.yaml#owner_control.verbs.resume.event", op: contains, value: card.resumed}
    ct_refs: []
  S17-unratified-intent-blocked:
    class: control
    narrative: 【负向/CT-PLN-003】planner 提交 intent.ratified_by != owner 的卡给
      scheduler→intent-ratified 前置检查拒绝——未批准意图不得开卡（声明层先决：
      check 已注册 active + scheduler 前置已声明；运行时攻击由 adversary 执行）
    asserts:
      - {path: "standards/flows.yaml#intent_ratification.steps.4", op: contains, value: intent-ratified}
      - {path: "standards/flows.yaml#intent_ratification.steps.4", op: contains, value: CT-PLN-003}
      - {path: "standards/checks.yaml#checks", op: contains, value: intent-ratified}
      - {path: "standards/intent-routing.yaml#intents.deliver.acceptance_source", op: eq, value: new_ratable}
      - {path: "standards/intent-routing.yaml#intents.deliver.owner_sync", op: contains, value: synchronous}
    ct_refs: [CT-PLN-003]
