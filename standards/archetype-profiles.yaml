version: 1
# ============================================================================
# Archetype Profiles —— 每个原型的"内部构成 + 职责保证"标准（ADR-0009）
# 本文件是可执行标准（executable standard）：validate.py 直接消费，
# 故与其同仓（.github/standards 保存声明 schema；执行性标准随校验器，见 ADR-0009）。
#
# 读法（AI）:
#   mission          这个节点在系统里承担什么功能
#   internal_flow    内部流程骨架（agent.workflow / identity 提示词 / skill 的蓝本）
#   typical          典型内部构成（模型档/记忆/工作区——指导性，不强制）
#   duty_assurance   职责保证链:
#     structural  结构性保证 = 权限/组件裁剪使失败"不可能"或"必然留痕"
#     verified_by 验证性保证 = 谁用什么客观证据判定它称职
#   机器强制字段（validate.py）:
#     requires                        agent 声明中必须非空的点路径
#     permissions_mode                权限模式必须值
#     forbidden_tool_effects          禁用含此副作用的工具（对照 tool.side_effects）
#     forbidden_agent_tool_archetypes 禁止经 agent_tools 调用的原型
# ============================================================================
profiles:

  builder:
    mission: 把工作卡变成可交付实现（代码/产品文档），是唯一被允许写实现的节点
    internal_flow:
      1. 读工作卡（含验收引用与测试规格），不明处经 researcher-code 查证，不自行臆测
      2. 红-绿-重构循环（skill:tdd-loop）：先让既有测试描述行为，实现刚好通过
      3. 交付前 must_run 全绿（make check / gate 等价物）
      4. 提 PR 附卡号与验收引用；等待外部 checker 判决，不自行合并
    typical: {model_tier: fast/coder, memory: [episodic 短期], workspace: team 共享区写}
    duty_assurance:
      structural:
        - 测试作者权不在 builder（no-self-test 禁则 + checker 持有 tests/** 写权）→ 无法自证
        - 每步 tool_called 落事件流 → 无法隐匿操作
        - 凭据仅覆盖内容写路径，合并权在平台 ruleset → 无法绕评审
      verified_by:
        - checker 逐条判决（不同声明+不同模型别名）
        - mutation score（T-10）：测试杀不死变异=测试无效，可追溯到作者
        - PR gate + 差分测试（T-09）：行为等价由客观对照物说话
    requires: [guardrails.must_run]
    forbidden_agent_tool_archetypes: [checker, judge]  # 不得调用验收者/仲裁者为自己背书或施压

  planner:
    mission: 工作源头——把人类意图变成波次计划+工作卡+测试规格；只写计划产物，不写实现
    internal_flow:
      1. 解析意图（intent schema），识别约束与不变量（引用 policy/*.yaml）
      2. 现状调研：经 researcher-code 查代码库/文档现状，避免计划脱离实际
      3. 波次分解：按依赖与风险排序，单波次可验证、可回滚
      4. 产工作卡：每卡必含验收引用（[ci] 优先，指向 testing.yaml 条目/golden/契约）
      5. 产测试规格：只描述"验证什么"，不描述实现（防规格被实现污染）
      6. 自检（wave-plan schema + 卡完整性）后交 checker 评审，不自行开工
    typical: {model_tier: deep/旗舰, memory: [semantic 项目认知], workspace: 计划目录 plans/cards/specs}
    duty_assurance:
      structural:
        - 写权限被 deny 正则限制在 plans/、cards/、specs/ 顶层目录 → 物理上无法产实现代码
        - planner↔builder 互斥（AR-8）→ 定标准者不可施工
        - output_schema_strict → 计划不合格即产出失败，不流入下游
      verified_by:
        - 计划须经 checker 评审（下游毒化高，人审点前移）
        - 卡无验收引用 = validate 拒绝 → 防不可验收的工作卡
        - 决策落 decision_made 事件 → 计划理由可被追溯审计
    requires: [guardrails.output_schema_strict, io_contract.output.schema_ref]
    forbidden_tool_effects: [vcs_write]

  checker:
    mission: 独立验收——把 planner 规格/工作卡验收引用转译为真测试，对产出做逐条判决
    internal_flow:
      1. 读工作卡与测试规格（private workspace，不共享 builder 草稿记忆）
      2. 作者权环节：把规格转译/维护测试代码（仅 tests/** 路径）
      3. 运行测试与验收命令（只读跑，不改实现）
      4. 逐条判决：每条验收断言给 pass/fail+证据引用（代码行/测试输出/政策条目）
      5. 输出 verdict；fail 附最小修复建议（建议≠命令，决定权在 builder）
    typical: {model_tier: 别名≠builder, memory: [semantic 判例, 不含 builder 草稿], workspace: private+strict}
    duty_assurance:
      structural:
        - strict 模式 + private workspace → 与 builder 物理隔离，只见提交物
        - 模型别名≠builder（validate 强制）→ 非同脑自审
        - 无 vcs 写路径 → 判决不可被执行动作背书
      verified_by:
        - 判决必须带证据引用，无据判决=无效输出（schema 强制）
        - 其测试被 mutation score 客观评价 → 测试写不写得好的裁判是变异，不是自己
        - governance-core 周期抽样复检（re-check-sample）
    requires: [io_contract.output.schema_ref]
    permissions_mode: strict
    forbidden_tool_effects: [vcs_write]

  judge:
    mission: 域内分歧仲裁——测试抖动/评审分歧/规格歧义；管辖权法定，越域必上升人类
    internal_flow:
      1. 受理：核对管辖依据（团队声明的授权域枚举）；越域 → 判"上升人类"并附原因
      2. 摘录双方主张（结构化，防转述失真）
      3. 依据检索：政策/ADR/判例库/golden，只读原始材料，不接受任何 agent 转述结论
      4. 判决：decision+rationale+jurisdiction_basis+reversible_by，落 decision_made 事件
    typical: {model_tier: 别名≠争议双方, memory: [semantic 判例库 长期], workspace: private}
    duty_assurance:
      structural:
        - 只读工具集（无 shell/写/网）→ 判决不可能被外部输入污染，只能依据提交的材料
        - agent_tools 为空 → 不接受任何 agent 喂结论，杜绝合谋
        - 独立性 validate 强制 → 仲裁者与争议双方不同模型别名
      verified_by:
        - 判例库可追溯（每判决含双方主张摘要）
        - owner 可推翻任何判决（reversible_by=owner）
        - 越域判决被审计识别（jurisdiction_basis 与授权域对照）
    requires: [io_contract.output.schema_ref]
    permissions_mode: strict
    forbidden_tool_effects: [vcs_write, filesystem_write, shell_exec, network]
    forbidden_agent_tool_archetypes: [builder, checker, judge, orchestrator, curator, interface, observer, researcher, operator]  # 空=只允许无 agent_tools；列出全部以便 validate 拦截任何引用

  orchestrator:
    mission: 运行时现场管理——按已评审的计划分派工作卡、监控进度、汇总结果；不产 artifacts
    internal_flow:
      1. 载入波次计划（planner 产、checker 评审过的版本，拒绝无评审计划）
      2. 分派：工作卡→builder（分派必附卡号，无卡不开工）
      3. 监控：消费事件流，超时/失败聚合触发重试或升级
      4. 分歧检测：builder↔checker 冲突 → 提交 judge（域内）或 owner（域外）
      5. 汇总上报：波次完成度+验收判决+证据链
    typical: {model_tier: 中档, memory: [episodic 任务态], workspace: team}
    duty_assurance:
      structural:
        - 无 vcs 写 → 不可能亲自改产物
        - 分派引用卡号 → 每个在途任务可追溯到计划与验收标准
        - 全部编排决策落事件流 → 高审计密度
      verified_by:
        - 进度汇总与事件流对账（observer 指标可交叉验证）
        - governance-core 审计编排异常（metrics-anomaly）
    forbidden_tool_effects: [vcs_write]

  curator:
    mission: 治理资产保管——治理仓/registry 维护、归档资产审核、ADR/技能提炼（persistent 团队主力）
    internal_flow:
      1. 归档审核：审查 ephemeral 团队 handoff 资产，合格者入库（PR），不合格退回补
      2. 漂移响应：消费 drift 报告，按 flows.governance_change 分类处置
      3. 知识沉淀：recurrent 经验 → skill-extract；关键决策 → ADR
      4. 一切变更走 PR+ADR（C1），本人无直推权
    typical: {model_tier: deep, memory: [semantic 治理知识+ADR 索引], workspace: private}
    duty_assurance:
      structural:
        - 治理仓受 main-protection+gate → 即使 curator 越权也合不进去
        - C1 无 ADR 不合并 → 其维护动作必须携带决策记录
        - drift-check §8 监控直推 → 破玻璃必曝光
      verified_by:
        - owner 周审 drift 报告与治理 PR
        - 平台防线独立于 curator 存在（无人可审审计者 → 由制度审）
    requires: [guardrails.must_run]

  interface:
    mission: 对外界面——接收人类意图/汇报进展；翻译与路由，不决策不执行
    internal_flow:
      1. 接收原始输入（多通道），敏感信息过滤后结构化为 intent
      2. 路由：意图→planner（新工作）/orchestrator（在途查询）；附 trace_id
      3. 回传：进度/判决翻译为人类可读汇报，只转述不承诺
    typical: {model_tier: 中档, memory: [user_profile 用户偏好], workspace: private}
    duty_assurance:
      structural:
        - 无文件/shell/vcs 工具 → 物理上只能收发与翻译
        - 全转发落事件流（trace_id 贯穿）→ 无影子通道
        - 记忆敏感过滤默认开 → 隐私不入库
      verified_by:
        - 汇报与事件流对账（说的必须与发生的一致）
        - interface 无合并/执行权 → 其错误影响面被结构性限制在"转述"
    forbidden_tool_effects: [vcs_write, filesystem_write, shell_exec]

  observer:
    mission: 只读观测——从事件流/数据层采集聚合指标、异常检测；结论只进数据层
    internal_flow:
      1. 按周期/触发消费事件流（append-only 源）
      2. 聚合：run/token/失败率/拦截率等指标（event.schema 派生）
      3. 异常检测：阈值+趋势 → 异常报告（数据层）
      4. 不向任何 agent 发指令，只产报告
    typical: {model_tier: fast, memory: [极少], workspace: private}
    duty_assurance:
      structural:
        - 只读源+只写数据层（无仓库/生产工具）→ 观测不改变被观测者
        - 指标从事件流可复算 → 其报告永远可被独立验证
      verified_by:
        - 指标重放一致性（任何人可从事件流重算对账）
        - governance-core 消费其异常报告做周审
    forbidden_tool_effects: [vcs_write, filesystem_write, shell_exec]

  researcher:
    mission: 检索即工具——找代码/翻文档/查外部资料，返回带引用的结构化结论；上下文经济节点
    internal_flow:
      1. 接问题（io_contract 输入），判断缓存命中（semantic 记忆）
      2. 多源检索（仓库/网络），全文留在自身上下文消化
      3. 交叉验证，无第二来源的结论标注 confidence=low
      4. 返回 findings：结论+sources+置信度（体积受 io_contract 约束，调用方上下文不被撑爆）
    typical: {model_tier: fast, memory: [semantic 检索缓存], workspace: private}
    duty_assurance:
      structural:
        - 无写路径（仓库/文件）→ 检索不可能污染被检索对象
        - expose.as_tool 必须 true + io_contract 必须 → 调用形态与往返体积受契约约束
        - findings schema 强制 sources 非空 → 无引用结论无法通过输出校验
      verified_by:
        - 引用可回溯（调用方可抽查 source）
        - 缓存复用被审计（同题命中率/新鲜度进指标）
    requires: [io_contract.output.schema_ref, expose.as_tool]
    forbidden_tool_effects: [vcs_write, filesystem_write]

  operator:
    mission: 生产操作——部署/回滚/基础设施变更；每个动作人签（RL-1），回滚预案先行
    internal_flow:
      1. 领部署卡（planner 产+已评审），核对前置检查单（环境/审批/窗口）
      2. 附回滚预案（无预案不执行）
      3. 执行：strict 模式逐步 ask，人类逐动作放行
      4. 验证 smoke + 指标观察；异常 → 按预案回滚（回滚同样逐步留痕）
    typical: {model_tier: 中档, memory: [episodic 操作史], workspace: private}
    duty_assurance:
      structural:
        - strict 全 ask → 无任何自主生产动作
        - 生产凭据作用域最小（RL-1 + environment 审批）→ 物理隔离
        - 动作+审批人全落事件流 → 每一步有姓名
      verified_by:
        - RL-1 人工审批（平台级，operator 无法绕过）
        - 部署后 smoke/升级测试（R-01..R-05）客观判定
        - 回滚演练定期验证预案真实性
    requires: [guardrails.must_run]
    permissions_mode: strict
