# LLM Gateway 配置（LiteLLM proxy）
# ADR-0002 rev1：与 registry/models.yaml 同仓；validate.py 强制别名对齐。
# 规则：model_name = 对外别名（与 models.yaml alias 完全一致）；
#       同一 model_name 写多条 = 路由组（自动 failover / 用量轮转）。
model_list:
  # ── flash-pool: coder-fast ──────────────────────────────
  - model_name: coder-fast
    litellm_params:
      model: openai/<UPSTREAM_MODEL_A>     # TODO 部署时替换为真实 provider/模型名
      api_key: os.environ/PROVIDER_KEY_A
  # 加第二节点即自动组成 failover 组（注释示例）：
  # - model_name: coder-fast
  #   litellm_params:
  #     model: deepseek/deepseek-chat
  #     api_key: os.environ/PROVIDER_KEY_B

  # ── flagship-pool: coder-deep ───────────────────────────
  - model_name: coder-deep
    litellm_params:
      model: openai/<UPSTREAM_MODEL_B>     # TODO
      api_key: os.environ/PROVIDER_KEY_A

  # ── flagship-pool: reviewer ─────────────────────────────
  - model_name: reviewer
    litellm_params:
      model: openai/<UPSTREAM_MODEL_C>      # TODO
      api_key: os.environ/PROVIDER_KEY_A

  # ── sovereign-pool: judge-deep（第三族——judge 族独立性，ADR-0011）──
  - model_name: judge-deep
    litellm_params:
      model: openai/<UPSTREAM_MODEL_D>      # TODO 部署时换不同 provider 的强推理模型（异于 A/B/C 族）
      api_key: os.environ/PROVIDER_KEY_D

  # ── embed-pool: embed-default ───────────────────────────
  - model_name: embed-default
    litellm_params:
      model: openai/<EMBED_MODEL>          # TODO
      api_key: os.environ/PROVIDER_KEY_A

router_settings:
  routing_strategy: usage-based-routing-v2   # 按用量路由：单节点配额尽/失败自动切组内下一节点
  num_retries: 2
  timeout: 600
  allowed_fails: 3                           # 连续失败 3 次拉黑该节点
  cooldown_time: 60                          # 拉黑 60s

# ── 预算熔断（ADR-0010 flows.yaml budget 的执行点）─────────────────
# 【design-only，非 LiteLLM 原生配置——CodeRabbit #5】
# 实现为 scheduler 的运行时行为：开卡时调 LiteTTM /key/generate 派生 per-card 虚拟 key
# （max_budget/max_tokens 元数据，需启用 LiteLLM config DB），超限网关 429 fail-closed；
# scheduler 收 circuit_broken 事件 → 回 planner 重规划。落地步骤见 README「预算熔断」节。
# 同参重试按卡 risk_class 上限（默认 1；high ≤2）为 scheduler 侧限制，非网关职责。

litellm_settings:
  drop_params: true
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY  # 管理面 key（生成 per-team key 用）；绝不发给 agent
