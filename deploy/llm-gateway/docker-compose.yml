services:
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.74.9-patch-stable   # pin 固定 tag，升级=改这里走 PR
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    env_file: .env          # 不进 git（.gitignore 已含 *.local/密钥模式，本文件手建）
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 5s
      retries: 3
