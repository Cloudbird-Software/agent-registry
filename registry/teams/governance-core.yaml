id: governance-core
version: 2.0.0
status: active
goal: 常设治理团队：归档审核+漂移响应+知识沉淀（curator）；控制测试与 premortem（adversary）；对治理资产持续负责
members:
- agent: agent:curator-main
  count: 1
  as_tool: false
- agent: agent:red-adversary
  count: 1
  as_tool: false
topology: peer（curator 与 adversary 互不领导——adversary 独立性即价值）
orchestration:
  assign: cron 触发（周审/控制测试周期）+ 事件触发（handoff 到达/drift 报告）
  merge: owner 手合（治理仓 C1/C2 永不 auto-merge）
  workflow_ref: workflows/governance-core.flow.yaml
verification:
  in_team_check:
    checkers: []
    coverage: all-outputs
    note: curator 产出走平台防线（owner-only CODEOWNERS+gate+drift-check §8）；adversary findings
      只进数据层——审计者不由被审计方检查，由制度审
  external_audit:
    team: null:owner
    frequency: weekly
    method:
    - drift-review
    - control-test-report
    - escape-review
    note: owner 周审：drift 报告 + adversary 控制测试报告 + escape_rate 周报
workspace:
  shared:
    root: env:GOVERNANCE_WORKSPACE_ROOT
    version_control: true
  layout:
    inbox: inbox/
    artifacts: artifacts/
    decisions: decisions/
    findings: findings/
storage:
  type: postgresql
  ref: env:TEAM_DB_DSN
lifecycle:
  type: persistent
  destroy_policy: manual
channels:
- web
- tui
