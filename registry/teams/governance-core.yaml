id: governance-core
version: 1.0.0
status: active
goal: "常设治理团队：持有 .github 治理仓与 agent-registry 的审批权；接收并审核 ephemeral 团队的归档资产；运行漂移检测与周报"
members:
  - {agent: agent:reviewer, count: 1, as_tool: false}
topology: leader-teammate
orchestration:
  assign: leader-dispatch
  merge: leader-aggregate
  workflow_ref: workflows/governance-core.flow.yaml
verification:
  # 审计者自身不由被审计方检查（无人可审审计者）→ 由平台防线兜底：
  # main-protection + gate + drift-check §8 + owner 破玻璃回填制
  in_team_check: {checkers: [], coverage: all-outputs, note: "curator 团队产出走平台防线（PR+gate），无内部 builder/checker 分离需求"}
  external_audit: {team: "null:owner", frequency: weekly, method: [drift-review], note: "owner 周会审阅 drift 报告"}
workspace:
  shared:
    root: env:GOVERNANCE_WORKSPACE_ROOT
    version_control: true
  layout: {inbox: inbox/, artifacts: artifacts/, decisions: decisions/}
storage:
  type: postgresql
  ref: env:TEAM_DB_DSN
lifecycle:
  type: persistent               # 持续存在；对治理资产持续负责（AR-6）
  destroy_policy: manual
channels: [web, tui]
