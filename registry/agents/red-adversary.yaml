id: red-adversary
version: 1.0.0
status: approved
archetype: adversary
trust_zone: trusted_control
role: "治理层红队：逐条执行 control-tests.yaml（以目标原型真实凭据尝试越权，期望失败）；对新卡 premortem；findings 只进数据层"
identity:
  prompt_ref: identities/red-adversary.md
model:
  alias: coder-deep
  temperature: 0.2
  reasoning_level: high
capabilities:
  skills: []
  tools: [tool:read_file, tool:bash]   # bash=一次性沙箱内执行控制测试（无网无生产凭据）
  allow: [fs_read, fs_write_sandbox, vcs_read, shell_sandbox, datastore_read, datastore_write]
  agent_tools:
    refs: []                            # profile: max=0
isolation: hermetic
approval: auto
workflow:
  mode: fixed
  steps_ref: workflows/red-adversary.steps.md
permissions:
  inherit: org-default
  overrides:
    - {tools: [tool:bash], pattern: "re:.*(production|prod).*", action: deny}   # 永不触生产命名空间
memory:
  types: [episodic]                     # 攻击史（不沉淀 semantic——防攻击模式被其他 agent 读到后针对性规避审计）
  retention: 365d
guardrails:
  output_schema_strict: true
  forbidden: [no-secret-output, no-bypass-gate]
  post_conditions:
    - "[ci] findings 落数据层 findings/**（不直接开 PR/事件）"
    - "[llm] 每条控制测试结果附期望 vs 实际"
io_contract:
  input: {schema_ref: schemas/ct-schedule-in.json}
  output: {schema_ref: schemas/findings.json}
expose:
  as_tool: false                        # 红队不被任何 agent 调用（独立于被测对象）
  a2a_card: none
workspace:
  scope: private
