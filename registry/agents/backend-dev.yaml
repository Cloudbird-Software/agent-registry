id: backend-dev
version: 1.1.0
status: approved
archetype: builder
role: "Go/TS 后端开发：模块实现 + 测试 + PR 提交"
identity:
  prompt_ref: identities/backend-dev.md
model:
  alias: coder-fast
  temperature: 0.2
  reasoning_level: low
capabilities:
  skills: [skill:tdd-loop, skill:code-review-fix]
  tools: [tool:bash, tool:read_file, tool:write_file, tool:gitcode-pr]
permissions:
  inherit: org-default
  mode: normal
  overrides:
    - {tools: [tool:bash], pattern: "git push *", severity: HIGH}
    - {tools: [tool:bash], pattern: "re:.*rm -rf.*", action: deny}
credential:
  github_app: cloudbird-agent
  secrets: [GITCODE_TOKEN]
memory:
  types: [episodic]
  retention: 30d
guardrails:
  output_schema_strict: true
  must_run: ["make check"]
  forbidden: [no-self-test, no-force-push, no-secret-output, no-bypass-gate]
  post_conditions:
    - "[ci] PR gate 全绿"
    - "[llm] 提交说明与任务目标对应"
io_contract:
  input: {schema_ref: schemas/task-in.json}
  output: {schema_ref: schemas/pr-out.json}
expose:
  as_tool: true
  a2a_card: none
workspace:
  scope: team
